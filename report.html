<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SytBoard — Деталі</title>
<link rel="stylesheet" href="css/period.css">
<link rel="stylesheet" href="css/rangepicker.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/tasks.css">
<link rel="stylesheet" href="css/loading.css">
<link rel="stylesheet" href="css/vira.css">
</head>
<body>
<div id="appnav"></div>
<header class="top">
  <div>
    <div class="kicker">SytBoard</div>
    <h1>Деталі</h1>
  </div>
</header>

<div class="bar-sticky">
  <div class="filterbar">
    <div class="fgroup">
      <span class="flabel" id="lbl-views">Що показати</span>
      <div class="seg" id="views" role="group" aria-labelledby="lbl-views"></div>
    </div>

    <div id="periodctl" class="fcontents">
      <div class="fgroup">
        <span class="flabel" id="lbl-range">Період</span>
        <div class="frow">
          <button type="button" id="range-btn" class="rangebtn" aria-describedby="lbl-range"></button>
        </div>
      </div>
      <div class="fgroup">
        <span class="flabel" id="lbl-grain">Графіки по</span>
        <div class="seg" id="grain" role="group" aria-labelledby="lbl-grain"></div>
      </div>
    </div>

    <div id="scopectl" class="fcontents">
      <div class="fgroup">
        <label class="flabel" for="cat-select">Категорія товарів</label>
        <select id="cat-select"></select>
      </div>
      <div class="fgroup">
        <label class="flabel" for="mode-select">Які продажі</label>
        <select id="mode-select"></select>
      </div>
      <div class="fgroup">
        <label class="flabel" for="cmp-select">Порівняти з</label>
        <select id="cmp-select"></select>
      </div>
    </div>

    <div id="dayctl" class="fcontents" hidden>
      <div class="fgroup">
        <label class="flabel" for="day-select">День звіту</label>
        <div class="frow">
          <button type="button" id="day-prev" aria-label="Попередній день">←</button>
          <select id="day-select"></select>
          <button type="button" id="day-next" aria-label="Наступний день">→</button>
        </div>
      </div>
    </div>

    <button type="button" id="refresh" class="fright" title="Перечитати дані з BAS, Google Analytics і Google Ads">↻ Оновити дані</button>
  </div>

  <p class="fhint" id="scope-hint"></p>
  <div class="meta">
    <span id="range-note"></span>
    <span class="chips" id="sources"></span>
  </div>
  <nav class="jump" id="jump" aria-label="Розділи звіту"></nav>
</div>

<p class="status" id="status" role="status"></p>
<main id="report" aria-busy="true"></main>

<script src="js/api.js"></script>
<script src="js/fmt.js"></script>
<script src="js/dom.js"></script>
<script src="js/nav.js"></script>
<script src="js/tasks-widget.js"></script>
<script src="js/loading.js"></script>
<script src="js/benchmarks.js"></script>
<script src="js/glossary.js"></script>
<script src="js/period-struct.js"></script>
<script src="js/rangepicker.js"></script>
<script src="js/period.js"></script>
<script src="js/vira.js"></script>
</body>
</html>
